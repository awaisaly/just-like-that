<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Elca Airbridge">
  <!--
    Elca Airbridge brand mark
    Concept: arched airbridge span + ascending aircraft
    Colors: navy #10193a · blue #1668e3 · accent #ff6a2c
  -->
  <rect width="64" height="64" rx="14" fill="#10193a"/>
  <circle cx="50" cy="14" r="18" fill="#1668e3" opacity="0.14"/>

  <!-- Bridge arch -->
  <path
    d="M8 48c10-22 21-32 32-32 9.5 0 15 7 17.5 16"
    fill="none"
    stroke="#1668e3"
    stroke-width="6"
    stroke-linecap="round"
  />
  <!-- Accent path -->
  <path
    d="M11 50c7.5-14 16.5-21 25.5-21 7 0 12.5 4.2 16 9.5"
    fill="none"
    stroke="#ff6a2c"
    stroke-width="2.75"
    stroke-linecap="round"
  />
  <!-- Supports -->
  <path d="M18 50v8M42 36v22" stroke="#ffffff" stroke-width="3.25" stroke-linecap="round"/>

  <!-- Aircraft -->
  <path
    fill="#ffffff"
    d="M45 14.5l13 3.4-3.6 3.2-3.3-1.15-3.9 2.55-1.55-2.65 3.4-1.8z"
  />
  <circle cx="55.5" cy="18.6" r="1.5" fill="#ff6a2c"/>
</svg>
